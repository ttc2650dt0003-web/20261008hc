<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名言集</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <h1>名言集</h1>
    <div class="left-box">
        <figure>
            <img src="img/yanineko.jpeg" alt="佐藤ヤニ子">
            <figcaption>佐藤ヤニ子</figcaption>
        </figure>
        <p>
           「 ニャーはなんにも悪いことしてないのに 」<br>
            「 嘘にゃ… 」<br>
    
        </p>
    </div>

    <div class="right-box">
        <figure>
            <img src="img/kurumi.jpeg" alt="福賀くるみ">
            <figcaption>福賀くるみ</figcaption>
        </figure>
        <p>
            「ドル円ロング！」<br>
            「下がってええええええええ！！！」<br>
            「うるせ～～！！知らね～～～～！！」<br>
            「ま、まだ慌てるような時間じゃない 」<br>
        </p>
    </div>

    <div class="center-box">
        <figure>
            <img src="img/kaiji.png" alt="伊藤開司">
            <figcaption>伊藤開司</figcaption>
        </figure>
        <p>
        「 自分を救うのは……自分だけっ……！」<br>
        「 胸を張れっ…！手痛く負けた時こそ…胸をっ…！」<br>
        </p>
    </div>
</body>
</html>
